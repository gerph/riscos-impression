[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riscos-impression"
version = "0.1.0"
description = "Decode RISC OS Impression documents and convert them to OvationPro DDL, PDF, and HTML"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Charles Ferguson (Gerph)", email = "gerph@gerph.org" }]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
riscos-impression = "riscos_impression.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
