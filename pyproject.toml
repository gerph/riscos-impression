[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riscos-impression"
version = "0.1.0"
description = "Decode RISC OS Impression documents and convert them to OvationPro DDL, PDF, and HTML"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Charles Ferguson (Gerph)", email = "gerph@gerph.org" }]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Experimental (artworks-experiment branch): formats/artworks_svg.py
# needs the third-party riscos_artworks structural decoder to render
# embedded ArtWorks pictures at all. Kept optional, not a core
# dependency, so the rest of the package keeps its own "no required
# runtime dependencies" rule (see PLAN.md) intact for everyone who
# doesn't need ArtWorks support. Note riscos-artworks itself requires
# Python 3.11+, one version newer than this project's own floor.
# artworks_svg.py needs riscos_artworks.denormalise(), added on that
# package's own feature/denormalise-record-tree branch -- not yet in
# any released version, so this pin doesn't actually guarantee it's
# present. Bump this once that branch lands in a release.
artworks = ["riscos-artworks>=0.2.0"]

[project.scripts]
riscos-impression = "riscos_impression.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
