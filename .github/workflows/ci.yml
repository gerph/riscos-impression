name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build PRM-in-XML documentation
        uses: gerph/riscos-prminxml-action@v1
        with:
          files: docs/impression-documents.xml docs/impression-ddf.xml
          output: output/docs
          style: prm

      - name: Determine package version
        id: pkgversion
        run: |
          version=$(grep -m1 '^version' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package documentation
        id: docsversion
        run: |
          leafname="riscos-impression-${{ steps.pkgversion.outputs.version }}-docs.zip"
          cd output/docs && zip -9r "../../$leafname" *
          echo "leafname=$leafname" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Documentation
          path: ${{ steps.docsversion.outputs.leafname }}

  build-package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: SourcePackage
          path: |
            dist/*.tar.gz
            dist/*.whl

  release:
    runs-on: ubuntu-latest
    needs: [test, build-docs, build-package]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Documentation
          path: release/docs

      - uses: actions/download-artifact@v8
        with:
          name: SourcePackage
          path: release/dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/docs/*
            release/dist/*
